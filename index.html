<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#003a8c" />
  <title>Türkiye Kamu-Sen Bolu Üye Avantajları</title>
  <style>
    :root{--blue:#003a8c;--blue2:#0e66c2;--bg:#f4f7fb;--text:#0a2e6e;--line:#dce6f5}
    *{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
    .topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,58,140,.08)}
    .topbar-inner{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-weight:800;letter-spacing:.2px}.brand small{display:block;font-weight:600;color:#0e66c2;margin-top:2px}
    .badge{background:var(--blue);color:#fff;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;white-space:nowrap}
    .site-frame{width:100%;height:calc(100vh - 68px);border:0;display:block;background:#fff}
    .deal{max-width:1200px;margin:0 auto 24px;padding:18px 16px 28px}
    .deal-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px rgba(0,58,140,.10);overflow:hidden}
    .deal-head{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .deal-head h2{margin:0;font-size:22px}.discount{font-size:34px;font-weight:900;white-space:nowrap}
    .deal-body{padding:18px 20px}.category{display:inline-block;background:#eaf3ff;color:var(--blue);font-weight:800;border-radius:999px;padding:6px 10px;margin-bottom:10px}
    .deal-body p{margin:8px 0;line-height:1.55}.deal-body strong{color:var(--blue)}
    @media(max-width:700px){.brand{font-size:14px}.badge{font-size:11px;padding:7px 10px}.site-frame{height:68vh}.deal-head{align-items:flex-start;flex-direction:column}.discount{font-size:30px}}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">TÜRKİYE KAMU-SEN<small>Bolu İl Temsilciliği · Üye Avantajları</small></div>
      <div class="badge">Yeni anlaşma eklendi</div>
    </div>
  </div>

  <iframe class="site-frame" src="https://kamu-sen-bolu-avantajlari.e4414mre.chatgpt.site/" title="Türkiye Kamu-Sen Bolu Üye Avantajları" allow="fullscreen"></iframe>

  <section class="deal" id="otomotiv">
    <div class="deal-card">
      <div class="deal-head">
        <h2>Cabioğlu Otomotiv Toyota-Honda Özel Servis</h2>
        <div class="discount">%10 İndirim</div>
      </div>
      <div class="deal-body">
        <div class="category">Otomotiv</div>
        <p><strong>İndirim oranı:</strong> %10</p>
        <p><strong>Adres:</strong> Adelet sarayı arkası, Aşağısoku, Eski polis karakolu karşısı Sanayi sitesi D:5 Blok No: 6, 14100 Bolu</p>
      </div>
    </div>
  </section>
</body>
</html>
